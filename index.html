<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script defer src="https://cdn.jsdelivr.net/npm/face-api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body{margin:0;font-family:-apple-system;background:#f2f4f7;}
.container{padding:16px;max-width:500px;margin:auto;}

h2{margin:0;font-size:20px;}
.subtitle{font-size:13px;color:#667085;margin-bottom:15px;}

.upload{
  background:#fff;border:2px dashed #d0d5dd;
  border-radius:16px;padding:25px;text-align:center;margin-bottom:15px;
}

.tabs{
  display:flex;background:#e4e7ec;border-radius:999px;padding:4px;margin-bottom:10px;
}
.tab{flex:1;text-align:center;padding:10px;border-radius:999px;}
.tab.active{background:#fff;font-weight:600;}

.modo{
  flex:1;padding:10px;border:none;border-radius:999px;background:#e4e7ec;font-size:13px;
}
.modo.active{background:#111;color:#fff;}

.category{margin-top:10px;font-size:13px;color:#667085;}

.card{
  background:#fff;border-radius:14px;padding:14px;margin-top:8px;
  display:flex;justify-content:space-between;align-items:center;
  border:1px solid #eaecf0;
}

.preview{
  margin-top:20px;background:#fff;border-radius:16px;padding:15px;text-align:center;
}

canvas{max-width:100%;border-radius:12px;}

.btn{
  position:fixed;bottom:20px;left:16px;right:16px;
  background:#111;color:#fff;padding:16px;border:none;border-radius:999px;
}
</style>
</head>

<body>

<div class="container">

<h2>ImageResize Pro</h2>
<p class="subtitle">IA Automática + Safe Area + Modos Canva</p>

<div class="upload" onclick="upload.click()">
<input type="file" id="upload" accept="image/*,.svg" style="display:none">
Clique para enviar (PNG, JPG, SVG)
</div>

<div class="tabs">
<div class="tab active" onclick="trocarAba(event,'meta')">Meta</div>
<div class="tab" onclick="trocarAba(event,'google')">Google</div>
</div>

<div style="display:flex;gap:8px;margin-bottom:10px;">
<button onclick="modo='cover';renderModo(this)" class="modo active">Preencher</button>
<button onclick="modo='contain';renderModo(this)" class="modo">Sem cortar</button>
<button onclick="modo='expand';renderModo(this)" class="modo">Expandir IA</button>
</div>

<div id="lista"></div>

<div id="preview" class="preview">Selecione formato</div>

</div>

<button class="btn" onclick="baixar()">Baixar</button>

<script>
let img=null;
let aba="meta";
let carregada=false;
let modo="cover";
let autoModo=true;

// IA load
async function loadIA(){
 await faceapi.nets.tinyFaceDetector.loadFromUri("https://cdn.jsdelivr.net/npm/face-api.js/weights");
}
loadIA();

function renderModo(btn){
document.querySelectorAll(".modo").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
autoModo=false; // se usuário clicar manual, desliga IA
}

// 🔥 IA DECISÃO AUTOMÁTICA
async function decidirModo(i, face, texto){

let ratioImg = img.naturalWidth / img.naturalHeight;
let ratioTarget = i[2] / i[3];
let diff = Math.abs(ratioImg - ratioTarget);

// 🔥 DETECÇÃO SIMPLES DE LOGO
let logoDetectado = false;

if(texto && texto.w < img.naturalWidth * 0.4){
  logoDetectado = true;
}

// prioridade IA
if(face){
  return "cover";
}

if(logoDetectado){
  return "contain";
}

if(diff < 0.2){
  return "cover";
}

if(diff < 0.6){
  return "expand";
}

return "contain";
}

const dados={/* SEUS FORMATOS MANTIDOS */
meta:[
{cat:"Facebook",itens:[
["Facebook Feed","Post no feed do Facebook",1200,630],
["Facebook Story","Stories do Facebook",1080,1920],
["Facebook Cover","Capa de página do Facebook",820,312],
["Facebook Profile","Foto de perfil do Facebook",180,180]
]},
{cat:"Facebook Ads",itens:[
["Facebook Ad (Square)","Anúncio quadrado do Facebook",1080,1080]
]},
{cat:"Instagram",itens:[
["Instagram Post (Square)","Post quadrado do Instagram",1080,1080],
["Instagram Post (Portrait)","Post vertical do Instagram",1080,1350],
["Instagram Post (Landscape)","Post horizontal do Instagram",1080,566],
["Instagram Story","Stories e Reels do Instagram",1080,1920],
["Instagram Profile","Foto de perfil do Instagram",320,320]
]}
],
google:[
{cat:"Google Ads",itens:[
["Google Display (Square)","Anúncio display quadrado",250,250],
["Google Display (Small)","Anúncio display pequeno",200,200],
["Google Leaderboard","Banner leaderboard",728,90],
["Google Banner","Banner padrão",468,60],
["Google Skyscraper","Banner vertical skyscraper",120,600]
]},
{cat:"YouTube",itens:[
["YouTube Thumbnail","Miniatura de vídeo do YouTube",1280,720],
["YouTube Channel Art","Arte de canal do YouTube",2560,1440],
["YouTube Profile","Foto de perfil do YouTube",800,800]
]}
]
};

upload.onchange=e=>{
let f=e.target.files[0];
if(!f) return;

let r=new FileReader();
r.onload=ev=>{
img=new Image();
img.src=ev.target.result;
img.onload=()=>{
carregada=true;
preview.innerHTML="Imagem carregada ✔️";
};
};
r.readAsDataURL(f);
};

function render(){
let lista=document.getElementById("lista");
lista.innerHTML="";
dados[aba].forEach(g=>{
let cat=document.createElement("div");
cat.className="category";
cat.innerText=g.cat;
lista.appendChild(cat);

g.itens.forEach(i=>{
let card=document.createElement("div");
card.className="card";

card.innerHTML=`
<div>
<strong>${i[0]}</strong><br>
<span>${i[1]}</span>
</div>
<div>${i[2]}×${i[3]}</div>
`;

card.onclick=()=>{
if(!carregada) return alert("Envie imagem");
gerarPreview(i);
rodarIA(i);
};

lista.appendChild(card);
});
});
}

function gerarPreview(i){
preview.innerHTML="<canvas id='cv'></canvas>";
let cv=document.getElementById("cv");
let ctx=cv.getContext("2d");

let scale=2;
let W=i[2]*scale;
let H=i[3]*scale;

cv.width=W;
cv.height=H;

let ratio=Math.min(W/img.naturalWidth,H/img.naturalHeight);
let w=img.naturalWidth*ratio;
let h=img.naturalHeight*ratio;

ctx.drawImage(img,(W-w)/2,(H-h)/2,w,h);
}

async function rodarIA(i){

let face=await faceapi.detectSingleFace(img,new faceapi.TinyFaceDetectorOptions()).catch(()=>null);

let texto=null;
try{
let res=await Tesseract.recognize(img.src,'eng');
if(res.data.words.length) texto=res.data.words[0].bbox;
}catch(e){}

// 🔥 IA AUTOMÁTICA
if(autoModo){
modo = await decidirModo(i, face, texto);
}

refinar(i,face,texto);
}

// REFINE (mantido igual)
function refinar(i,face,texto){

let cv=document.getElementById("cv");
let ctx=cv.getContext("2d");

let scale=2;
let W=i[2]*scale;
let H=i[3]*scale;

let safeTop=0,safeBottom=0;

if(i[2]===1080 && i[3]===1920){
safeTop=250*scale;
safeBottom=300*scale;
}

let safeH=H-safeTop-safeBottom;

ctx.clearRect(0,0,W,H);

let foco = face?.box || texto || {
x:img.naturalWidth/2-100,
y:img.naturalHeight/2-100,
w:200,h:200
};

if(modo==="cover"){
let ratio=Math.max(W/img.naturalWidth,safeH/img.naturalHeight);
let w=img.naturalWidth*ratio;
let h=img.naturalHeight*ratio;

let cx=(foco.x+foco.w/2)*ratio;
let cy=(foco.y+foco.h/2)*ratio;

let x=W/2-cx;
let y=safeTop+(safeH/2)-cy;

x=Math.max(Math.min(x,0),W-w);
y=Math.max(Math.min(y,safeTop),H-h-safeBottom);

ctx.drawImage(img,x,y,w,h);
}

if(modo==="contain"){
let ratio=Math.min(W/img.naturalWidth,safeH/img.naturalHeight);
let w=img.naturalWidth*ratio;
let h=img.naturalHeight*ratio;

ctx.drawImage(img,(W-w)/2,(H-h)/2,w,h);
}

if(modo==="expand"){

ctx.filter="blur(40px)";
let ratioBg=Math.max(W/img.naturalWidth,H/img.naturalHeight);

let wBg=img.naturalWidth*ratioBg;
let hBg=img.naturalHeight*ratioBg;

let xBg=(W-wBg)/2;
let yBg=(H-hBg)/2;

ctx.drawImage(img,xBg,yBg,wBg,hBg);
ctx.filter="none";

let ratio=Math.min(W/img.naturalWidth,safeH/img.naturalHeight);
let w=img.naturalWidth*ratio;
let h=img.naturalHeight*ratio;

let cx=(foco.x+foco.w/2)*ratio;
let cy=(foco.y+foco.h/2)*ratio;

let x=W/2-cx;
let y=safeTop+(safeH/2)-cy;

ctx.drawImage(img,x,y,w,h);
}

ctx.strokeStyle="rgba(255,0,0,0.3)";
ctx.strokeRect(0,safeTop,W,safeH);
}

function baixar(){
let cv=document.getElementById("cv");
if(!cv) return alert("Selecione formato");

let a=document.createElement("a");
a.download="imagem.png";
a.href=cv.toDataURL("image/png");
a.click();
}

function trocarAba(e,a){
aba=a;
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
e.target.classList.add("active");
render();
}

render();
</script>

</body>
</html>
