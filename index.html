<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script defer src="https://cdn.jsdelivr.net/npm/face-api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body {
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:#f2f4f7;
}

.container{
  padding:16px;
  max-width:500px;
  margin:auto;
}

h2{font-size:20px;margin-bottom:4px;}
.subtitle{font-size:13px;color:#667085;margin-bottom:20px;}

.upload{
  background:#fff;
  border:2px dashed #d0d5dd;
  border-radius:16px;
  padding:30px;
  text-align:center;
  margin-bottom:20px;
}

.tabs{
  display:flex;
  background:#e4e7ec;
  border-radius:999px;
  padding:4px;
  margin-bottom:20px;
}

.tab{flex:1;text-align:center;padding:10px;border-radius:999px;color:#667085;}
.tab.active{background:#fff;font-weight:600;color:#111;}

.category{margin-top:18px;font-size:13px;color:#667085;}

.card{
  background:#fff;
  border-radius:14px;
  padding:14px;
  margin-top:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border:1px solid #eaecf0;
}

.card div:last-child{
  background:#f2f4f7;
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
}

.preview{
  margin-top:24px;
  background:#fff;
  border-radius:16px;
  padding:20px;
  border:1px solid #eaecf0;
  text-align:center;
}

canvas{
  max-width:100%;
  border-radius:12px;
}

.btn{
  position:fixed;
  bottom:20px;
  left:16px;
  right:16px;
  background:#111;
  color:#fff;
  padding:16px;
  border:none;
  border-radius:999px;
}
</style>
</head>

<body>

<div class="container">

<h2>ImageResize Pro</h2>
<p class="subtitle">Redimensione imagens para Meta e Google</p>

<div class="upload" onclick="upload.click()">
<input type="file" id="upload" accept="image/*,.svg" style="display:none">
Clique para enviar (PNG, JPG, SVG)
</div>

<div class="tabs">
<div class="tab active" onclick="trocarAba(event,'meta')">Meta</div>
<div class="tab" onclick="trocarAba(event,'google')">Google</div>
</div>

<div id="lista"></div>

<div id="preview" class="preview">Selecione formato</div>

</div>

<button class="btn" onclick="baixar()">Baixar</button>

<script>
let img=null;
let aba="meta";
let carregada=false;

async function loadIA(){
 await faceapi.nets.tinyFaceDetector.loadFromUri("https://cdn.jsdelivr.net/npm/face-api.js/weights");
}
loadIA();

const dados = /* MANTIDO IGUAL AO SEU */ {
meta:[
{cat:"Facebook",itens:[
["Facebook Feed","Post no feed do Facebook",1200,630],
["Facebook Story","Stories do Facebook",1080,1920],
["Facebook Cover","Capa de página do Facebook",820,312],
["Facebook Profile","Foto de perfil do Facebook",180,180]
]},
{cat:"Facebook Ads",itens:[
["Facebook Ad (Square)","Anúncio quadrado do Facebook",1080,1080]
]},
{cat:"Instagram",itens:[
["Instagram Post (Square)","Post quadrado do Instagram",1080,1080],
["Instagram Post (Portrait)","Post vertical do Instagram",1080,1350],
["Instagram Post (Landscape)","Post horizontal do Instagram",1080,566],
["Instagram Story","Stories e Reels do Instagram",1080,1920],
["Instagram Profile","Foto de perfil do Instagram",320,320]
]}
],
google:[
{cat:"Google Ads",itens:[
["Google Display (Square)","Anúncio display quadrado",250,250],
["Google Display (Small)","Anúncio display pequeno",200,200],
["Google Leaderboard","Banner leaderboard",728,90],
["Google Banner","Banner padrão",468,60],
["Google Skyscraper","Banner vertical skyscraper",120,600]
]},
{cat:"YouTube",itens:[
["YouTube Thumbnail","Miniatura de vídeo do YouTube",1280,720],
["YouTube Channel Art","Arte de canal do YouTube",2560,1440],
["YouTube Profile","Foto de perfil do YouTube",800,800]
]}
]
};

upload.onchange = e => {
let f = e.target.files[0];
if(!f) return;

if(f.type==="image/svg+xml" || f.name.endsWith(".svg")){
let reader=new FileReader();
reader.onload=ev=>{
let blob=new Blob([ev.target.result],{type:"image/svg+xml"});
let url=URL.createObjectURL(blob);
let imgTemp=new Image();
imgTemp.onload=()=>{
img=imgTemp;
carregada=true;
preview.innerHTML="SVG carregado ✔️";
};
imgTemp.src=url;
};
reader.readAsText(f);
return;
}

let r=new FileReader();
r.onload=ev=>{
img=new Image();
img.src=ev.target.result;
img.onload=()=>{
carregada=true;
preview.innerHTML="Imagem carregada ✔️";
};
};
r.readAsDataURL(f);
};

function render(){
let lista=document.getElementById("lista");
lista.innerHTML="";
dados[aba].forEach(g=>{
let cat=document.createElement("div");
cat.className="category";
cat.innerText=g.cat;
lista.appendChild(cat);

g.itens.forEach(i=>{
let card=document.createElement("div");
card.className="card";

card.innerHTML=`
<div>
<strong>${i[0]}</strong><br>
<span>${i[1]}</span>
</div>
<div>${i[2]}×${i[3]}</div>
`;

card.onclick=()=>{
if(!carregada) return alert("Envie imagem");
gerarPreview(i);
rodarIA(i);
};

lista.appendChild(card);
});
});
}

function gerarPreview(i){
preview.innerHTML="<canvas id='cv'></canvas>";
let cv=document.getElementById("cv");
let ctx=cv.getContext("2d");

let scale=2;
let W=i[2]*scale;
let H=i[3]*scale;

cv.width=W;
cv.height=H;

let ratio=Math.min(W/img.naturalWidth,H/img.naturalHeight);
let w=img.naturalWidth*ratio;
let h=img.naturalHeight*ratio;

ctx.drawImage(img,(W-w)/2,(H-h)/2,w,h);
}

// 🧠 SAFE AREA PRO
function getSafe(i,scale){
let safeTop=0,safeBottom=0;

if(i[2]===1080 && i[3]===1920){
safeTop=250*scale;
safeBottom=300*scale;
}

if(i[2]===1200 && i[3]===630){
safeTop=60*scale;
safeBottom=60*scale;
}

if(i[2]===728 && i[3]===90){
safeTop=10*scale;
safeBottom=10*scale;
}

return {safeTop,safeBottom};
}

async function rodarIA(i){
let face=await faceapi.detectSingleFace(img,new faceapi.TinyFaceDetectorOptions()).catch(()=>null);

let texto=null;
try{
let res=await Tesseract.recognize(img.src,'eng');
if(res.data.words.length) texto=res.data.words[0].bbox;
}catch(e){}

refinar(i,face,texto);
}

function refinar(i,face,texto){

let cv=document.getElementById("cv");
let ctx=cv.getContext("2d");

let scale=2;
let W=i[2]*scale;
let H=i[3]*scale;

let {safeTop,safeBottom}=getSafe(i,scale);
let safeH=H-safeTop-safeBottom;

ctx.clearRect(0,0,W,H);

let ratio=Math.min(W/img.naturalWidth,safeH/img.naturalHeight);
let w=img.naturalWidth*ratio;
let h=img.naturalHeight*ratio;

let foco = face?.box || texto || {
x:img.naturalWidth/2-100,
y:img.naturalHeight/2-100,
w:200,h:200
};

let cx=(foco.x+foco.w/2)*ratio;
let cy=(foco.y+foco.h/2)*ratio;

let x=W/2-cx;
let y=safeTop+(safeH/2)-cy;

ctx.drawImage(img,x,y,w,h);

// 🔥 overlay visual estilo Canva
ctx.strokeStyle="rgba(255,0,0,0.4)";
ctx.lineWidth=2;
ctx.strokeRect(0,safeTop,W,safeH);
}

function baixar(){
let cv=document.getElementById("cv");
if(!cv) return alert("Selecione formato");

let a=document.createElement("a");
a.download="imagem.png";
a.href=cv.toDataURL("image/png");
a.click();
}

function trocarAba(e,a){
aba=a;
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
e.target.classList.add("active");
render();
}

render();
</script>

</body>
</html>
